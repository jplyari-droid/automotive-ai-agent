<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Automotive AI Agent</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
    }

    .container {
      max-width: 950px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .panel {
      background: #1f2937;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .topbar {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .topbar button {
      flex: 1;
    }

    #caseInfo {
      background: #1f2937;
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 14px;
      word-break: break-all;
    }

    #caseIdDisplay {
      font-weight: bold;
    }

    #vehicleInfo {
      margin-top: 8px;
      font-size: 14px;
      opacity: 0.9;
      white-space: pre-wrap;
    }

    #chat {
      background: #1f2937;
      min-height: 350px;
      max-height: 600px;
      overflow-y: auto;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .message {
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .user {
      background: #374151;
    }

    .ai {
      background: #0f766e;
    }

    .history {
      background: #312e81;
    }

    .message a {
      color: #bfdbfe;
      font-weight: bold;
      text-decoration: underline;
      overflow-wrap: anywhere;
    }

    .message a:hover {
      color: #ffffff;
    }

    textarea {
      width: 100%;
      height: 90px;
      box-sizing: border-box;
      padding: 12px;
      font-size: 16px;
      border-radius: 10px;
      border: none;
      margin-bottom: 10px;
      resize: vertical;
    }

    input[type="file"],
    input[type="text"],
    select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      background: white;
      color: black;
      border-radius: 10px;
      border: none;
      margin-bottom: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 17px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.95;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #previewBox {
      display: none;
      margin-bottom: 12px;
      padding: 10px;
      background: #1f2937;
      border-radius: 10px;
    }

    #previewImage {
      max-width: 100%;
      max-height: 300px;
      border-radius: 10px;
      display: none;
      margin-top: 8px;
    }

    #fileInfo {
      margin-top: 8px;
      font-size: 14px;
      opacity: 0.9;
    }

    #status {
      margin-top: 10px;
      font-size: 14px;
      opacity: 0.9;
    }

    .small {
      font-size: 14px;
      opacity: 0.8;
      margin-bottom: 10px;
    }

    #searchResults {
      display: none;
      margin-top: 10px;
    }

    .caseResult {
      background: #374151;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      line-height: 1.5;
    }

    .caseResult:hover {
      background: #4b5563;
    }

    #dtcSearchResults {
      display: none;
      margin-top: 10px;
    }

    .dtcResult {
      background: #374151;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .dtcResult:hover {
      background: #4b5563;
    }

    .label {
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .topbar {
        flex-direction: column;
      }

      .container {
        padding: 12px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1 id="appTitle">🚗 Automotive AI Agent</h1>

  <div class="panel">
    <div id="languageLabel" class="small" style="font-weight: bold;">Language</div>
    <select id="languageSelect">
      <option value="urdu">اردو</option>
      <option value="english">English</option>
      <option value="japanese">日本語</option>
      <option value="sinhala">සිංහල</option>
    </select>
  </div>

  <div class="topbar">
    <button
      id="newCaseButton"
      type="button"
    >
      <span id="newCaseButtonText">New Diagnostic Case</span>
    </button>
  </div>

  <div id="caseInfo">

    <div>
      <span id="diagnosticCaseLabel">Diagnostic Case:</span>
      <span id="caseIdDisplay">
        <span id="notCreatedText">Not created yet</span>
      </span>
    </div>

    <div id="vehicleInfo"></div>

  </div>

  <!-- VEHICLE HISTORY SEARCH -->

  <div class="panel">

    <div
      class="small"
      style="font-weight: bold;"
    >
      <span id="vehicleHistoryTitle">Search Vehicle History</span>
    </div>

    <input
      id="vehicleSearch"
      type="text"
      placeholder="VIN, Frame/Chassis No. یا Model Code لکھیں"
    />

    <button
      id="searchButton"
      type="button"
    >
      <span id="vehicleSearchButtonText">Search Vehicle History</span>
    </button>

    <div id="searchStatus"></div>

    <div id="searchResults"></div>

  </div>

  <!-- DTC HISTORY SEARCH -->

  <div class="panel">

    <div
      class="small"
      style="font-weight: bold;"
    >
      <span id="dtcHistoryTitle">Search DTC History</span>
    </div>

    <input
      id="dtcSearch"
      type="text"
      placeholder="DTC code لکھیں، مثال: P0420 یا U0167"
    />

    <button
      id="dtcSearchButton"
      type="button"
    >
      <span id="dtcSearchButtonText">Search DTC History</span>
    </button>

    <div id="dtcSearchStatus"></div>

    <div id="dtcSearchResults"></div>

  </div>

  <!-- CHAT -->

  <div id="chat">

    <div id="welcomeMessage" class="message ai"></div>

  </div>

  <!-- QUESTION -->

  <textarea
    id="question"
    placeholder="اپنا automotive diagnostic سوال یہاں لکھیں..."
  ></textarea>

  <!-- FILE -->

  <input
    id="fileInput"
    type="file"
    accept="image/*,.pdf,application/pdf"
  />

  <div id="previewBox">

    <div id="selectedFileLabel">
      Selected file:
    </div>

    <img
      id="previewImage"
      alt="Selected preview"
    />

    <div id="fileInfo"></div>

  </div>

  <div id="optionalFileHelp" class="small">
    Optional: fault code screenshot, live data image, scanner photo یا PDF scan report۔
  </div>

  <button
    id="sendButton"
    type="button"
  >
    <span id="sendButtonText">Send Question / File</span>
  </button>

  <div id="status"></div>

</div>

<script>
document.addEventListener(
  "DOMContentLoaded",
  function () {

    const chat =
      document.getElementById("chat");

    const questionBox =
      document.getElementById("question");

    const fileInput =
      document.getElementById("fileInput");

    const sendButton =
      document.getElementById("sendButton");

    const newCaseButton =
      document.getElementById(
        "newCaseButton"
      );

    const status =
      document.getElementById("status");

    const previewBox =
      document.getElementById(
        "previewBox"
      );

    const previewImage =
      document.getElementById(
        "previewImage"
      );

    const fileInfo =
      document.getElementById(
        "fileInfo"
      );

    const caseIdDisplay =
      document.getElementById(
        "caseIdDisplay"
      );

    const vehicleInfo =
      document.getElementById(
        "vehicleInfo"
      );

    const vehicleSearch =
      document.getElementById(
        "vehicleSearch"
      );

    const searchButton =
      document.getElementById(
        "searchButton"
      );

    const searchResults =
      document.getElementById(
        "searchResults"
      );

    const searchStatus =
      document.getElementById(
        "searchStatus"
      );

    const dtcSearch =
      document.getElementById(
        "dtcSearch"
      );

    const dtcSearchButton =
      document.getElementById(
        "dtcSearchButton"
      );

    const dtcSearchResults =
      document.getElementById(
        "dtcSearchResults"
      );

    const dtcSearchStatus =
      document.getElementById(
        "dtcSearchStatus"
      );

    let previousResponseId = "";

    let currentCaseId = "";

    const languageSelect = document.getElementById("languageSelect");

    const translations = {
      urdu: {
        htmlLang: "ur", direction: "rtl", languageLabel: "زبان", newCase: "نیا تشخیصی کیس", diagnosticCase: "تشخیصی کیس:", notCreated: "ابھی بنایا نہیں گیا",
        vehicleHistoryTitle: "گاڑی کی ہسٹری تلاش کریں", vehicleSearchPlaceholder: "VIN، Frame/Chassis No. یا Model Code لکھیں", vehicleSearchButton: "گاڑی کی ہسٹری تلاش کریں",
        dtcHistoryTitle: "DTC ہسٹری تلاش کریں", dtcSearchPlaceholder: "DTC code لکھیں، مثال: P0420 یا U0167", dtcSearchButton: "DTC ہسٹری تلاش کریں",
        questionPlaceholder: "اپنا automotive diagnostic سوال یہاں لکھیں...", selectedFile: "منتخب فائل:", optionalFileHelp: "اختیاری: fault code screenshot، live data image، scanner photo یا PDF scan report۔",
        send: "سوال / فائل بھیجیں", welcome: "Automotive Diagnostic Agent تیار ہے۔\n\nآپ سوال لکھ سکتے ہیں، image upload کر سکتے ہیں، اور PDF diagnostic report بھی upload کر سکتے ہیں۔\n\nVehicle history کو VIN، Frame/Chassis Number یا Model Code سے search کیا جا سکتا ہے۔\n\nDTC history کو P0420 یا U0167 جیسے code سے search کیا جا سکتا ہے۔",
        thinking: "AI Agent سوچ رہا ہے...", sending: "درخواست بھیجی جا رہی ہے...", creatingCase: "نیا diagnostic case بنایا جا رہا ہے...", saved: "Diagnostic case database میں محفوظ ہو گیا۔"
      },
      english: {
        htmlLang: "en", direction: "ltr", languageLabel: "Language", newCase: "New Diagnostic Case", diagnosticCase: "Diagnostic Case:", notCreated: "Not created yet",
        vehicleHistoryTitle: "Search Vehicle History", vehicleSearchPlaceholder: "Enter VIN, Frame/Chassis No. or Model Code", vehicleSearchButton: "Search Vehicle History",
        dtcHistoryTitle: "Search DTC History", dtcSearchPlaceholder: "Enter DTC code, e.g. P0420 or U0167", dtcSearchButton: "Search DTC History",
        questionPlaceholder: "Enter your automotive diagnostic question here...", selectedFile: "Selected file:", optionalFileHelp: "Optional: fault-code screenshot, live-data image, scanner photo or PDF scan report.",
        send: "Send Question / File", welcome: "Automotive Diagnostic Agent Ready.\n\nYou can type a question, upload an image, or upload a PDF diagnostic report.\n\nVehicle history can be searched by VIN, Frame/Chassis Number or Model Code.\n\nDTC history can be searched by a code such as P0420 or U0167.",
        thinking: "AI Agent is thinking...", sending: "Sending request...", creatingCase: "Creating new diagnostic case...", saved: "Diagnostic case saved to database."
      },
      japanese: {
        htmlLang: "ja", direction: "ltr", languageLabel: "言語", newCase: "新しい診断ケース", diagnosticCase: "診断ケース:", notCreated: "まだ作成されていません",
        vehicleHistoryTitle: "車両履歴を検索", vehicleSearchPlaceholder: "VIN、フレーム/シャシー番号、モデルコードを入力", vehicleSearchButton: "車両履歴を検索",
        dtcHistoryTitle: "DTC履歴を検索", dtcSearchPlaceholder: "DTCコードを入力（例: P0420 / U0167）", dtcSearchButton: "DTC履歴を検索",
        questionPlaceholder: "自動車診断の質問を入力してください...", selectedFile: "選択したファイル:", optionalFileHelp: "任意: 故障コード画面、ライブデータ画像、スキャナー写真、PDF診断レポート。",
        send: "質問 / ファイルを送信", welcome: "Automotive Diagnostic Agent の準備ができました。\n\n質問の入力、画像のアップロード、PDF診断レポートのアップロードができます。\n\nVIN、フレーム/シャシー番号、モデルコードから車両履歴を検索できます。\n\nP0420 や U0167 などのDTCコードから履歴を検索できます。",
        thinking: "AI Agent が診断中です...", sending: "リクエストを送信しています...", creatingCase: "新しい診断ケースを作成しています...", saved: "診断ケースをデータベースに保存しました。"
      },
      sinhala: {
        htmlLang: "si", direction: "ltr", languageLabel: "භාෂාව", newCase: "නව රෝග විනිශ්චය කේස්", diagnosticCase: "රෝග විනිශ්චය කේස්:", notCreated: "තවම සාදා නැත",
        vehicleHistoryTitle: "වාහන ඉතිහාසය සොයන්න", vehicleSearchPlaceholder: "VIN, Frame/Chassis No. හෝ Model Code ඇතුළත් කරන්න", vehicleSearchButton: "වාහන ඉතිහාසය සොයන්න",
        dtcHistoryTitle: "DTC ඉතිහාසය සොයන්න", dtcSearchPlaceholder: "DTC code ඇතුළත් කරන්න, උදා: P0420 හෝ U0167", dtcSearchButton: "DTC ඉතිහාසය සොයන්න",
        questionPlaceholder: "ඔබගේ automotive diagnostic ප්‍රශ්නය මෙහි ලියන්න...", selectedFile: "තෝරාගත් ගොනුව:", optionalFileHelp: "විකල්ප: fault code screenshot, live data image, scanner photo හෝ PDF scan report.",
        send: "ප්‍රශ්නය / ගොනුව යවන්න", welcome: "Automotive Diagnostic Agent සූදානම්.\n\nඔබට ප්‍රශ්නයක් ලියන්න, image upload කරන්න, හෝ PDF diagnostic report එකක් upload කරන්න පුළුවන්.\n\nVIN, Frame/Chassis Number හෝ Model Code මගින් vehicle history සෙවිය හැක.\n\nP0420 හෝ U0167 වැනි DTC code මගින් DTC history සෙවිය හැක.",
        thinking: "AI Agent විශ්ලේෂණය කරමින්...", sending: "ඉල්ලීම යවමින්...", creatingCase: "නව diagnostic case එක සාදමින්...", saved: "Diagnostic case එක database එකට save විය."
      }
    };

    function getSelectedLanguage() { return languageSelect.value || "urdu"; }
    function t(key) { const lang = getSelectedLanguage(); return (translations[lang] && translations[lang][key]) || translations.english[key] || key; }

    function applyLanguage(language) {
      const lang = translations[language] ? language : "urdu";
      languageSelect.value = lang;
      localStorage.setItem("automotiveAiLanguage", lang);
      document.documentElement.lang = translations[lang].htmlLang;
      document.documentElement.dir = translations[lang].direction;
      document.getElementById("languageLabel").textContent = t("languageLabel");
      document.getElementById("newCaseButtonText").textContent = t("newCase");
      document.getElementById("diagnosticCaseLabel").textContent = t("diagnosticCase");
      const notCreated = document.getElementById("notCreatedText");
      if (notCreated && !currentCaseId) notCreated.textContent = t("notCreated");
      document.getElementById("vehicleHistoryTitle").textContent = t("vehicleHistoryTitle");
      vehicleSearch.placeholder = t("vehicleSearchPlaceholder");
      document.getElementById("vehicleSearchButtonText").textContent = t("vehicleSearchButton");
      document.getElementById("dtcHistoryTitle").textContent = t("dtcHistoryTitle");
      dtcSearch.placeholder = t("dtcSearchPlaceholder");
      document.getElementById("dtcSearchButtonText").textContent = t("dtcSearchButton");
      questionBox.placeholder = t("questionPlaceholder");
      document.getElementById("selectedFileLabel").textContent = t("selectedFile");
      document.getElementById("optionalFileHelp").textContent = t("optionalFileHelp");
      document.getElementById("sendButtonText").textContent = t("send");
      const welcomeMessage = document.getElementById("welcomeMessage");
      if (welcomeMessage) welcomeMessage.textContent = t("welcome");
    }

    const savedLanguage = localStorage.getItem("automotiveAiLanguage") || "urdu";
    applyLanguage(savedLanguage);

    // =====================================
    // FILE PREVIEW
    // =====================================

    fileInput.addEventListener(
      "change",
      function () {

        const file =
          fileInput.files.length > 0
            ? fileInput.files[0]
            : null;

        if (!file) {

          previewBox.style.display =
            "none";

          previewImage.style.display =
            "none";

          previewImage.src = "";

          fileInfo.textContent = "";

          return;
        }

        previewBox.style.display =
          "block";

        fileInfo.textContent =
          "File: " +
          file.name +
          " (" +
          file.type +
          ")";

        if (
          file.type.startsWith(
            "image/"
          )
        ) {

          const imageUrl =
            URL.createObjectURL(
              file
            );

          previewImage.src =
            imageUrl;

          previewImage.style.display =
            "block";

        } else {

          previewImage.src = "";

          previewImage.style.display =
            "none";
        }
      }
    );

    // =====================================
    // SAFE CLICKABLE LINKS
    // =====================================

    function appendTextWithLinks(element, text) {
      const source = String(text || "");
      const urlPattern = /https?:\/\/[^\s<>"']+/gi;
      let lastIndex = 0;
      let match;

      while ((match = urlPattern.exec(source)) !== null) {
        if (match.index > lastIndex) {
          element.appendChild(
            document.createTextNode(source.slice(lastIndex, match.index))
          );
        }

        let url = match[0];
        let trailingPunctuation = "";

        while (/[.,;:!?)]$/.test(url)) {
          trailingPunctuation = url.slice(-1) + trailingPunctuation;
          url = url.slice(0, -1);
        }

        const link = document.createElement("a");
        link.href = url;
        link.textContent = url;
        link.target = "_blank";
        link.rel = "noopener noreferrer nofollow";
        element.appendChild(link);

        if (trailingPunctuation) {
          element.appendChild(document.createTextNode(trailingPunctuation));
        }

        lastIndex = match.index + match[0].length;
      }

      if (lastIndex < source.length) {
        element.appendChild(document.createTextNode(source.slice(lastIndex)));
      }
    }

    function renderAiMessage(element, answer) {
      element.textContent = "";
      appendTextWithLinks(
        element,
        "Automotive AI:\n" + String(answer || "")
      );
    }

    // =====================================
    // DISPLAY VEHICLE DATA
    // =====================================

    function showVehicleInfo(
      vehicle
    ) {

      if (!vehicle) {

        vehicleInfo.textContent =
          "";

        return;
      }

      const lines = [];

      if (vehicle.vin) {
        lines.push(
          "VIN: " +
          vehicle.vin
        );
      }

      if (vehicle.chassis_number) {
        lines.push(
          "Frame/Chassis: " +
          vehicle.chassis_number
        );
      }

      if (vehicle.model_code) {
        lines.push(
          "Model Code: " +
          vehicle.model_code
        );
      }

      if (vehicle.make) {
        lines.push(
          "Make: " +
          vehicle.make
        );
      }

      if (vehicle.model) {
        lines.push(
          "Model: " +
          vehicle.model
        );
      }

      if (vehicle.year) {
        lines.push(
          "Year: " +
          vehicle.year
        );
      }

      if (vehicle.engine_code) {
        lines.push(
          "Engine: " +
          vehicle.engine_code
        );
      }

      if (vehicle.mileage) {
        lines.push(
          "Mileage: " +
          vehicle.mileage
        );
      }

      vehicleInfo.textContent =
        lines.join(" | ");
    }

    // =====================================
    // ASK AI
    // =====================================

    async function askAgent() {

      const question =
        questionBox.value.trim();

      const file =
        fileInput.files.length > 0
          ? fileInput.files[0]
          : null;

      if (
        !question &&
        !file
      ) {

        alert(
          "Please enter a question or choose a file."
        );

        return;
      }

      sendButton.disabled = true;
      newCaseButton.disabled = true;
      searchButton.disabled = true;
      dtcSearchButton.disabled = true;

      sendButton.textContent =
        t("thinking");

      status.textContent =
        t("sending");

      const userMessage =
        document.createElement(
          "div"
        );

      userMessage.className =
        "message user";

      let userText =
        "You:\n";

      if (question) {
        userText += question;
      }

      if (file) {

        userText +=
          "\n\nFile: " +
          file.name;
      }

      userMessage.textContent =
        userText;

      chat.appendChild(
        userMessage
      );

      if (
        file &&
        file.type.startsWith(
          "image/"
        )
      ) {

        const chatImage =
          document.createElement(
            "img"
          );

        chatImage.src =
          URL.createObjectURL(
            file
          );

        chatImage.style.maxWidth =
          "100%";

        chatImage.style.maxHeight =
          "280px";

        chatImage.style.borderRadius =
          "10px";

        chatImage.style.marginBottom =
          "12px";

        chat.appendChild(
          chatImage
        );
      }

      if (
        file &&
        file.type ===
          "application/pdf"
      ) {

        const pdfNote =
          document.createElement(
            "div"
          );

        pdfNote.className =
          "message user";

        pdfNote.textContent =
          "PDF uploaded: " +
          file.name;

        chat.appendChild(
          pdfNote
        );
      }

      const loading =
        document.createElement(
          "div"
        );

      loading.className =
        "message ai";

      loading.textContent =
        t("thinking");

      chat.appendChild(
        loading
      );

      chat.scrollTop =
        chat.scrollHeight;

      try {

        const formData =
          new FormData();

        formData.append(
          "question",
          question
        );

        formData.append(
          "language",
          getSelectedLanguage()
        );

        if (file) {

          formData.append(
            "file",
            file
          );
        }

        if (
          previousResponseId
        ) {

          formData.append(
            "previousResponseId",
            previousResponseId
          );
        }

        if (
          currentCaseId
        ) {

          formData.append(
            "caseId",
            currentCaseId
          );
        }

        const response =
          await fetch(
            "/ask",
            {
              method: "POST",
              body: formData
            }
          );

        const data =
          await response.json();

        loading.remove();

        const aiMessage =
          document.createElement(
            "div"
          );

        aiMessage.className =
          "message ai";

        if (
          response.ok &&
          data.answer
        ) {

          renderAiMessage(aiMessage, data.answer);

          if (
            data.responseId
          ) {

            previousResponseId =
              data.responseId;
          }

          if (
            data.caseId
          ) {

            currentCaseId =
              data.caseId;

            caseIdDisplay.textContent =
              currentCaseId;
          }

          if (
            data.vehicleData
          ) {

            const vehicle =
              {
                vin:
                  data.vehicleData.vin,

                chassis_number:
                  data.vehicleData.chassisNumber,

                model_code:
                  data.vehicleData.modelCode,

                engine_code:
                  data.vehicleData.engineCode,

                mileage:
                  data.vehicleData.mileage
              };

            showVehicleInfo(
              vehicle
            );
          }

          status.textContent =
            t("saved");

        } else {

          aiMessage.textContent =
            "Error:\n" +
            (
              data.error ||
              "Unknown error"
            );

          status.textContent =
            "Error";
        }

        chat.appendChild(
          aiMessage
        );

      } catch (error) {

        loading.remove();

        const errorMessage =
          document.createElement(
            "div"
          );

        errorMessage.className =
          "message ai";

        errorMessage.textContent =
          "Connection Error:\n" +
          error.message;

        chat.appendChild(
          errorMessage
        );

        status.textContent =
          "Connection error";
      }

      questionBox.value = "";

      fileInput.value = "";

      previewBox.style.display =
        "none";

      previewImage.style.display =
        "none";

      previewImage.src = "";

      fileInfo.textContent = "";

      sendButton.disabled = false;
      newCaseButton.disabled = false;
      searchButton.disabled = false;
      dtcSearchButton.disabled = false;

      sendButton.innerHTML =
        '<span id="sendButtonText">' +
        t("send") +
        '</span>';

      chat.scrollTop =
        chat.scrollHeight;
    }

    // =====================================
    // NEW CASE
    // =====================================

    async function startNewCase() {

      newCaseButton.disabled =
        true;

      sendButton.disabled =
        true;

      searchButton.disabled =
        true;

      dtcSearchButton.disabled =
        true;

      status.textContent =
        t("creatingCase");

      try {

        const response =
          await fetch(
            "/new-case",
            {
              method: "POST"
            }
          );

        const data =
          await response.json();

        if (
          !response.ok ||
          !data.caseId
        ) {

          throw new Error(
            data.error ||
            "Could not create new case."
          );
        }

        currentCaseId =
          data.caseId;

        previousResponseId =
          "";

        caseIdDisplay.textContent =
          currentCaseId;

        vehicleInfo.textContent =
          "";

        chat.innerHTML = `
          <div class="message ai">
New diagnostic case started.

Case ID:
${currentCaseId}

گاڑی کی معلومات، VIN، Frame/Chassis Number، Model Code، DTC، symptoms، image یا PDF report بھیجیں۔
          </div>
        `;

        questionBox.value =
          "";

        fileInput.value =
          "";

        previewBox.style.display =
          "none";

        previewImage.style.display =
          "none";

        previewImage.src =
          "";

        fileInfo.textContent =
          "";

        status.textContent =
          "New diagnostic case created and saved.";

      } catch (error) {

        status.textContent =
          "Could not create new case.";

        alert(
          "New Case Error:\n" +
          error.message
        );

      } finally {

        newCaseButton.disabled =
          false;

        sendButton.disabled =
          false;

        searchButton.disabled =
          false;

        dtcSearchButton.disabled =
          false;
      }
    }

    // =====================================
    // VEHICLE SEARCH
    // =====================================

    async function searchVehicleHistory() {

      const query =
        vehicleSearch
          .value
          .trim();

      if (!query) {

        alert(
          "VIN, Frame/Chassis Number یا Model Code لکھیں۔"
        );

        return;
      }

      searchButton.disabled =
        true;

      searchStatus.textContent =
        "Searching vehicle history...";

      searchResults.style.display =
        "none";

      searchResults.innerHTML =
        "";

      try {

        const response =
          await fetch(
            "/vehicle-search/" +
            encodeURIComponent(
              query
            )
          );

        const data =
          await response.json();

        if (!response.ok) {

          throw new Error(
            data.error ||
            "Vehicle search failed."
          );
        }

        if (
          !data.cases ||
          data.cases.length === 0
        ) {

          searchStatus.textContent =
            "No vehicle history found.";

          return;
        }

        searchStatus.textContent =
          data.cases.length +
          " case(s) found.";

        searchResults.style.display =
          "block";

        data.cases.forEach(
          function (vehicleCase) {

            const div =
              document.createElement(
                "div"
              );

            div.className =
              "caseResult";

            let text =
              "Case ID: " +
              vehicleCase.case_id;

            if (
              vehicleCase.vin
            ) {

              text +=
                "\nVIN: " +
                vehicleCase.vin;
            }

            if (
              vehicleCase.chassis_number
            ) {

              text +=
                "\nFrame/Chassis: " +
                vehicleCase.chassis_number;
            }

            if (
              vehicleCase.model_code
            ) {

              text +=
                "\nModel Code: " +
                vehicleCase.model_code;
            }

            if (
              vehicleCase.engine_code
            ) {

              text +=
                "\nEngine: " +
                vehicleCase.engine_code;
            }

            if (
              vehicleCase.mileage
            ) {

              text +=
                "\nMileage: " +
                vehicleCase.mileage;
            }

            text +=
              "\n\nClick to load this case.";

            div.textContent =
              text;

            div.addEventListener(
              "click",
              function () {

                loadCase(
                  vehicleCase.case_id
                );
              }
            );

            searchResults.appendChild(
              div
            );
          }
        );

      } catch (error) {

        searchStatus.textContent =
          "Search error: " +
          error.message;

      } finally {

        searchButton.disabled =
          false;
      }
    }

    // =====================================
    // DTC SEARCH
    // =====================================

    async function searchDtcHistory() {

      const code =
        dtcSearch.value
          .trim()
          .toUpperCase();

      if (!code) {

        alert(
          "DTC code لکھیں، مثال: P0420 یا U0167"
        );

        return;
      }

      if (
        !/^(?:P|B|C|U)[0-9A-F]{4}(?:-[0-9A-F]{2})?$/.test(code)
      ) {

        alert(
          "DTC format درست نہیں ہے۔ مثال: P0420, U0167, C1111-96"
        );

        return;
      }

      dtcSearchButton.disabled =
        true;

      dtcSearchStatus.textContent =
        "Searching DTC history...";

      dtcSearchResults.style.display =
        "none";

      dtcSearchResults.innerHTML =
        "";

      try {

        const response =
          await fetch(
            "/dtc-search/" +
            encodeURIComponent(code)
          );

        const data =
          await response.json();

        if (!response.ok) {

          throw new Error(
            data.error ||
            "DTC search failed."
          );
        }

        if (
          !data.cases ||
          data.cases.length === 0
        ) {

          dtcSearchStatus.textContent =
            "No DTC history found for " +
            code +
            ".";

          return;
        }

        dtcSearchStatus.textContent =
          data.cases.length +
          " record(s) found for " +
          code +
          ".";

        dtcSearchResults.style.display =
          "block";

        data.cases.forEach(
          function (record) {

            const div =
              document.createElement(
                "div"
              );

            div.className =
              "dtcResult";

            let text =
              "DTC: " +
              (record.dtc_code || code) +
              "\nCase ID: " +
              record.case_id;

            if (record.module_name) {
              text +=
                "\nModule: " +
                record.module_name;
            }

            if (record.description) {
              text +=
                "\nDescription: " +
                record.description;
            }

            if (record.status) {
              text +=
                "\nStatus: " +
                record.status;
            }

            if (record.priority) {
              text +=
                "\nPriority: " +
                record.priority;
            }

            if (record.vin) {
              text +=
                "\nVIN: " +
                record.vin;
            }

            if (record.chassis_number) {
              text +=
                "\nFrame/Chassis: " +
                record.chassis_number;
            }

            if (record.model_code) {
              text +=
                "\nModel Code: " +
                record.model_code;
            }

            if (record.engine_code) {
              text +=
                "\nEngine: " +
                record.engine_code;
            }

            if (record.mileage) {
              text +=
                "\nMileage: " +
                record.mileage;
            }

            text +=
              "\n\nClick to load this diagnostic case.";

            div.textContent =
              text;

            div.addEventListener(
              "click",
              function () {

                loadCase(
                  record.case_id
                );
              }
            );

            dtcSearchResults.appendChild(
              div
            );
          }
        );

      } catch (error) {

        dtcSearchStatus.textContent =
          "DTC search error: " +
          error.message;

      } finally {

        dtcSearchButton.disabled =
          false;
      }
    }

    // =====================================
    // LOAD CASE HISTORY
    // =====================================

    async function loadCase(
      caseId
    ) {

      status.textContent =
        "Loading diagnostic history...";

      try {

        const response =
          await fetch(
            "/case/" +
            encodeURIComponent(
              caseId
            )
          );

        const data =
          await response.json();

        if (!response.ok) {

          throw new Error(
            data.error ||
            "Could not load case."
          );
        }

        currentCaseId =
          caseId;

        previousResponseId =
          "";

        caseIdDisplay.textContent =
          currentCaseId;

        showVehicleInfo(
          data.vehicle
        );

        chat.innerHTML =
          "";

        const header =
          document.createElement(
            "div"
          );

        header.className =
          "message history";

        header.textContent =
          "Loaded diagnostic history\n\nCase ID: " +
          currentCaseId;

        chat.appendChild(
          header
        );

        if (
          !data.history ||
          data.history.length === 0
        ) {

          const empty =
            document.createElement(
              "div"
            );

          empty.className =
            "message ai";

          empty.textContent =
            "No diagnostic records found for this case.";

          chat.appendChild(
            empty
          );

        } else {

          data.history.forEach(
            function (record) {

              if (
                record.user_question
              ) {

                const userMessage =
                  document.createElement(
                    "div"
                  );

                userMessage.className =
                  "message user";

                let text =
                  "You:\n" +
                  record.user_question;

                if (
                  record.file_name
                ) {

                  text +=
                    "\n\nFile: " +
                    record.file_name;
                }

                userMessage.textContent =
                  text;

                chat.appendChild(
                  userMessage
                );
              }

              if (
                record.ai_answer
              ) {

                const aiMessage =
                  document.createElement(
                    "div"
                  );

                aiMessage.className =
                  "message ai";

                renderAiMessage(aiMessage, record.ai_answer);

                chat.appendChild(
                  aiMessage
                );
              }

              if (
                record.openai_response_id
              ) {

                previousResponseId =
                  record.openai_response_id;
              }

            }
          );
        }

        chat.scrollTop =
          chat.scrollHeight;

        status.textContent =
          "Diagnostic history loaded.";

        searchResults.style.display =
          "none";

        dtcSearchResults.style.display =
          "none";

      } catch (error) {

        status.textContent =
          "Load Case Error: " +
          error.message;
      }
    }

    // =====================================
    // EVENTS
    // =====================================

    sendButton.addEventListener(
      "click",
      askAgent
    );

    newCaseButton.addEventListener(
      "click",
      startNewCase
    );

    searchButton.addEventListener(
      "click",
      searchVehicleHistory
    );

    vehicleSearch.addEventListener(
      "keydown",
      function (event) {

        if (
          event.key ===
          "Enter"
        ) {

          event.preventDefault();

          searchVehicleHistory();
        }
      }
    );

    dtcSearchButton.addEventListener(
      "click",
      searchDtcHistory
    );

    dtcSearch.addEventListener(
      "keydown",
      function (event) {

        if (
          event.key ===
          "Enter"
        ) {

          event.preventDefault();

          searchDtcHistory();
        }
      }
    );

    languageSelect.addEventListener(
      "change",
      function () {
        applyLanguage(languageSelect.value);
      }
    );

    questionBox.addEventListener(
      "keydown",
      function (event) {

        if (
          event.key ===
            "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          askAgent();
        }
      }
    );

  }
);
</script>

</body>
</html>
